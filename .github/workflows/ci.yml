name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Elixir 1.20 / OTP ${{ matrix.otp }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.3.4.17", "28.5.0.6", "29.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix quality.verify
      - run: mix hex.audit
